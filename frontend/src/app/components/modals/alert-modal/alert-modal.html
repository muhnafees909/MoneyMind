<div class="mm-dialog">
  <div class="mm-dialog-head">
    <span class="dialog-icon" [class]="'dialog-icon ' + data.type">
      @switch (data.type) {
        @case ('error') {
          <svg lucideOctagonAlert [size]="17"></svg>
        }
        @case ('success') {
          <svg lucideCircleCheck [size]="17"></svg>
        }
        @default {
          <svg lucideInfo [size]="17"></svg>
        }
      }
    </span>
    <h2 class="mm-dialog-title">{{ data.title }}</h2>
    <button class="dialog-close" (click)="close()" aria-label="Close">
      <svg lucideX [size]="15"></svg>
    </button>
  </div>

  <p class="mm-dialog-message">{{ data.message }}</p>

  <div class="mm-dialog-actions">
    <button class="btn btn-solid" (click)="close()">OK</button>
  </div>
</div>
