<div class="mm-dialog">
  <div class="mm-dialog-head">
    <span class="dialog-icon warn">
      <svg lucideTriangleAlert [size]="17"></svg>
    </span>
    <h2 class="mm-dialog-title">{{ data.title }}</h2>
    <button class="dialog-close" (click)="onCancel()" aria-label="Close">
      <svg lucideX [size]="15"></svg>
    </button>
  </div>

  <p class="mm-dialog-message">{{ data.message }}</p>

  <div class="mm-dialog-actions">
    <button class="btn btn-ghost" (click)="onCancel()">
      {{ data.cancelText || 'Cancel' }}
    </button>
    <button
      class="btn"
      [class.btn-danger]="isDestructive()"
      [class.btn-solid]="!isDestructive()"
      (click)="onConfirm()"
    >
      {{ data.confirmText || 'Confirm' }}
    </button>
  </div>
</div>
