<div class="modal-container">
  <div class="modal-header">
    <h2 class="modal-title">{{ data?.transaction ? 'Edit' : 'Add' }} Transaction</h2>
  </div>

  <div class="modal-content">
    <form class="transaction-form">
      <!-- Amount Field -->
      <div class="form-group">
        <label class="form-label">Amount</label>
        <div class="input-wrapper">
          <span class="currency-prefix">$</span>
          <input
            type="number"
            class="form-input"
            [(ngModel)]="transaction.amount"
            name="amount"
            placeholder="0.00"
            required
          />
        </div>
      </div>

      <!-- Description Field -->
      <div class="form-group">
        <label class="form-label">Description</label>
        <input
          type="text"
          class="form-input"
          [(ngModel)]="transaction.description"
          name="description"
          placeholder="Enter transaction description"
          required
        />
      </div>

      <!-- Category Field -->
      <div class="form-group">
        <label class="form-label">Category</label>
        <div class="custom-select">
          <button
            type="button"
            class="select-trigger"
            (click)="toggleCategoryDropdown()"
          >
            <span class="select-value">{{ transaction.category ? (transaction.category | titlecase) : 'Select a category' }}</span>
            <svg
              [class.rotated]="showCategoryDropdown"
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
            >
              <path d="M7 7.5L10 10.5L13 7.5" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </button>
          <div class="select-dropdown" *ngIf="showCategoryDropdown">
            <div
              *ngFor="let cat of categories"
              class="select-option"
              (click)="selectCategory(cat)"
              [class.selected]="transaction.category === cat"
            >
              {{ cat | titlecase }}
            </div>
          </div>
        </div>
      </div>

      <!-- Type Field -->
      <div class="form-group">
        <label class="form-label">Type</label>
        <div class="custom-select">
          <button
            type="button"
            class="select-trigger"
            (click)="toggleTypeDropdown()"
          >
            <span class="select-value">{{ transaction.transaction_type | titlecase }}</span>
            <svg
              [class.rotated]="showTypeDropdown"
              width="20"
              height="20"
              viewBox="0 0 20 20"
              fill="none"
              stroke="currentColor"
            >
              <path d="M7 7.5L10 10.5L13 7.5" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </button>
          <div class="select-dropdown" *ngIf="showTypeDropdown">
            <div
              class="select-option"
              (click)="selectType('expense')"
              [class.selected]="transaction.transaction_type === 'expense'"
            >
              Expense
            </div>
            <div
              class="select-option"
              (click)="selectType('income')"
              [class.selected]="transaction.transaction_type === 'income'"
            >
              Income
            </div>
          </div>
        </div>
      </div>

      <!-- Date Field -->
      <div class="form-group">
        <label class="form-label">Date</label>
        <input
          type="date"
          class="form-input"
          [(ngModel)]="dateInput"
          name="date"
          required
        />
      </div>

      <!-- Notes Field -->
      <div class="form-group">
        <label class="form-label">Notes (Optional)</label>
        <textarea
          class="form-textarea"
          [(ngModel)]="transaction.transaction_notes"
          name="notes"
          placeholder="Add any additional notes..."
          rows="3"
        ></textarea>
      </div>
    </form>
  </div>

  <div class="modal-actions">
    <button class="btn btn-cancel" (click)="onCancel()">Cancel</button>
    <button
      class="btn btn-save"
      (click)="onSave()"
      [disabled]="!transaction.amount || !transaction.description || !transaction.category"
    >
      Save Transaction
    </button>
  </div>
</div>
