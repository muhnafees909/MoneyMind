name: Database Backup

# Daily logical backup of the production Neon Postgres database to Backblaze B2.
#
# Storage is accessed through B2's S3-compatible API using the AWS CLI (preinstalled
# on GitHub runners), so switching to real S3 later is a change of endpoint/region
# secrets only — no workflow rewrite.
#
# Required repository secrets are documented in RESTORE.md.

on:
  schedule:
    # 03:00 UTC daily — off-peak for a US-based user base.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this manual backup is being taken (shows up in the run log)'
        required: false
        default: 'on-demand backup'

# Never let two backups overlap; a slow dump should not be stacked on by the next day's run.
concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Dump, upload, prune
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.B2_REGION }}
      # AWS CLI v2 pipes output through a pager, which has no business running in CI.
      AWS_PAGER: ''
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required secrets are present
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${BACKUP_DATABASE_URL:-}" ] || missing+=(BACKUP_DATABASE_URL)
          [ -n "${AWS_ACCESS_KEY_ID:-}" ]   || missing+=(B2_KEY_ID)
          [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || missing+=(B2_APPLICATION_KEY)
          [ -n "${B2_BUCKET:-}" ]           || missing+=(B2_BUCKET)
          [ -n "${B2_ENDPOINT:-}" ]         || missing+=(B2_ENDPOINT)
          [ -n "${AWS_DEFAULT_REGION:-}" ]  || missing+=(B2_REGION)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. See RESTORE.md."
            exit 1
          fi
          echo "All required secrets are set."

      - name: Resolve the direct (non-pooled) connection string
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          url="$BACKUP_DATABASE_URL"
          # pg_dump is a long-running single session; Neon's pooled endpoint (PgBouncer,
          # transaction mode) is the wrong target for it. Strip -pooler defensively so a
          # mistakenly-pasted pooled URL still produces a correct backup.
          if [[ "$url" == *"-pooler."* ]]; then
            url="${url//-pooler./.}"
            echo "::warning::BACKUP_DATABASE_URL pointed at Neon's pooled endpoint; rewrote it to the direct endpoint for pg_dump. Update the secret to the direct URL to silence this."
          fi
          # channel_binding=require breaks some client versions; sslmode=require is what matters.
          url="${url//&channel_binding=require/}"
          url="${url//?channel_binding=require&/?}"
          # Mask it so no later step can accidentally print it, then hand it on.
          echo "::add-mask::$url"
          echo "PGURL=$url" >> "$GITHUB_ENV"

      - name: Install a pg_dump matching the server's major version
        run: |
          set -euo pipefail
          # pg_dump refuses to dump a server newer than itself, and Neon upgrades majors
          # over time — so detect the server version instead of pinning a client version.
          # libpq itself is version-tolerant, so the preinstalled psql can do the query.
          server_num="$(psql "$PGURL" -tAc 'SHOW server_version_num' 2>/dev/null || true)"
          if [[ "$server_num" =~ ^[0-9]+$ ]]; then
            PG_MAJOR=$(( server_num / 10000 ))
          else
            PG_MAJOR=17
            echo "::warning::Could not detect the server version; defaulting to pg_dump ${PG_MAJOR}."
          fi
          echo "Server major version: ${PG_MAJOR}"

          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${PG_MAJOR}"

          echo "PG_BIN=/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_ENV"
          "/usr/lib/postgresql/${PG_MAJOR}/bin/pg_dump" --version

      - name: Run pg_dump
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y-%m-%d)"
          file="moneymind_backup_${stamp}.dump"
          echo "BACKUP_FILE=${file}" >> "$GITHUB_ENV"
          echo "BACKUP_DATE=${stamp}" >> "$GITHUB_ENV"

          # Custom format (-Fc): compressed, and restorable selectively / in parallel.
          # --no-owner / --no-privileges because Neon role names differ between projects,
          # and a restore into a fresh project must not fail on unknown grantees.
          "$PG_BIN/pg_dump" \
            --format=custom \
            --compress=6 \
            --no-owner \
            --no-privileges \
            --verbose \
            --file="$file" \
            "$PGURL"

          ls -lh "$file"

      - name: Verify the dump is a readable archive
        run: |
          set -euo pipefail
          # A zero-byte or truncated dump uploads just as happily as a good one.
          # Catch that here rather than discovering it during an actual restore.
          size=$(stat -c%s "$BACKUP_FILE")
          if [ "$size" -lt 10240 ]; then
            echo "::error::Dump is only ${size} bytes — treating as a failed backup."
            exit 1
          fi
          objects=$("$PG_BIN/pg_restore" --list "$BACKUP_FILE" | grep -c '^[0-9]' || true)
          if [ "$objects" -lt 1 ]; then
            echo "::error::pg_restore --list found no objects in the archive."
            exit 1
          fi
          echo "Archive verified: ${size} bytes, ${objects} restorable objects."
          echo "BACKUP_SIZE=${size}" >> "$GITHUB_ENV"

      - name: Upload to Backblaze B2
        run: |
          set -euo pipefail
          aws s3 cp "$BACKUP_FILE" "s3://${B2_BUCKET}/daily/${BACKUP_FILE}" \
            --endpoint-url "$B2_ENDPOINT" \
            --only-show-errors
          echo "Uploaded s3://${B2_BUCKET}/daily/${BACKUP_FILE}"

      - name: Promote Sunday's backup to the weekly tier
        run: |
          set -euo pipefail
          # Sundays get a second copy under weekly/, which is kept far longer than the
          # daily tier. Doing it as a copy keeps the retention rules trivially simple:
          # each prefix has exactly one age limit.
          if [ "$(date -u +%u)" = "7" ]; then
            aws s3 cp \
              "s3://${B2_BUCKET}/daily/${BACKUP_FILE}" \
              "s3://${B2_BUCKET}/weekly/${BACKUP_FILE}" \
              --endpoint-url "$B2_ENDPOINT" \
              --only-show-errors
            echo "Promoted ${BACKUP_FILE} to weekly/."
          else
            echo "Not Sunday (UTC) — no weekly copy."
          fi

      - name: Confirm the upload is listable in B2
        run: |
          set -euo pipefail
          # Read back what we just wrote: the upload is only real if B2 can list it.
          aws s3api head-object \
            --bucket "$B2_BUCKET" \
            --key "daily/${BACKUP_FILE}" \
            --endpoint-url "$B2_ENDPOINT" \
            --query 'ContentLength' --output text

      - name: Delete the local dump
        if: always()
        run: |
          # Runners are ephemeral, but don't keep the whole production database sitting
          # on disk for the remaining steps either.
          rm -fv moneymind_backup_*.dump || true

      - name: Prune backups past the retention window
        run: bash .github/scripts/prune-backups.sh

      - name: Summarize the run
        if: always()
        run: |
          {
            echo "### Database backup — ${BACKUP_DATE:-unknown}"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| File | \`${BACKUP_FILE:-not created}\` |"
            echo "| Size | ${BACKUP_SIZE:-0} bytes |"
            echo "| Destination | \`s3://${B2_BUCKET}/daily/\` |"
            echo "| Trigger | ${{ github.event_name }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    name: Email on failure
    runs-on: ubuntu-latest
    needs: backup
    # Separate job so it also fires on timeouts and runner-level failures, not just
    # on a failing step inside the backup job.
    if: failure()
    steps:
      - name: Send failure email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ secrets.BACKUP_ALERT_EMAIL_TO }}
          ALERT_FROM: ${{ secrets.BACKUP_ALERT_EMAIL_FROM }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${ALERT_TO:-}" ]; then
            echo "::warning::RESEND_API_KEY or BACKUP_ALERT_EMAIL_TO not set — skipping the email. The failed run is still visible in the Actions tab."
            exit 0
          fi
          from="${ALERT_FROM:-MoneyMind <onboarding@resend.dev>}"
          today="$(date -u +%Y-%m-%d)"

          payload=$(jq -n \
            --arg from "$from" \
            --arg to "$ALERT_TO" \
            --arg subject "[MoneyMind] Database backup FAILED — ${today}" \
            --arg text "The scheduled MoneyMind database backup failed on ${today} (UTC).

          Run log: ${RUN_URL}

          No new backup was written to B2 today. Previous backups are unaffected and still
          restorable — see RESTORE.md. Re-run the workflow manually once the cause is fixed." \
            '{from: $from, to: [$to], subject: $subject, text: $text}')

          code=$(curl -sS -o /tmp/resend.out -w '%{http_code}' \
            -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${RESEND_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "$payload")

          if [ "$code" -ge 300 ]; then
            echo "::error::Resend returned HTTP ${code} — the alert email was not delivered."
            cat /tmp/resend.out
            exit 1
          fi
          echo "Failure alert emailed to ${ALERT_TO}."
